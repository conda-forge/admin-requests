action: archive
reason: >
  This feedstock has been superseded by conda-forge/hip-feedstock, which has
  built the hipcc package from the ROCm CLR/llvm-project sources since 2024
  (the hipcc output is registered to both feedstocks in feedstock-outputs).
  The recipe here tracks a deprecated upstream mirror and has not been updated
  since 2024, while the ROCm stack on conda-forge has moved to 7.2.4.
  rocm-opencl-driver additionally has an upstream repository that was archived
  in 2019. Archiving stops the autotick bot from opening version and migration
  PRs that can never be merged. See
  https://github.com/conda-forge/conda-forge.github.io/issues/1923 for the
  ongoing ROCm packaging work.
feedstocks:
  - hipcc
  - rocm-opencl-driver
