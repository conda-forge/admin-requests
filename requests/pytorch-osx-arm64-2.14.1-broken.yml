# osx-arm64 pytorch 2.14.1 builds 0-2 lack pytorch's Metal 4 kernels but still
# dispatch to them on macOS 26.2+, so MPS SDPA (float16/bfloat16), cholesky,
# solve, inv and lu_factor fail there. Replaced by build 1304 (macOS 13.0+,
# with the pytorch/pytorch#196881 backport so it never dispatches to missing
# kernels) and build 2604 (macOS 26.0+, with the Metal 4 kernels) from
# https://github.com/conda-forge/pytorch-cpu-feedstock/pull/563
# See https://github.com/conda-forge/pytorch-cpu-feedstock/issues/562
